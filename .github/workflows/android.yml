name: Build & Release APK

# Chaque push construit l'APK. Sur la branche principale, si la version (versionName)
# n'a pas encore de release, la release GitHub vX.Y est créée avec l'APK.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Tests & APK
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Version
        id: v
        run: echo "tag=v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "CarnetJapon-${{ steps.v.outputs.tag }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: carnet-japon-apk
          path: CarnetJapon-*.apk
      - name: GitHub Release (nouvelle version uniquement)
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG existe déjà : rien à publier."
          else
            gh release create "$TAG" "CarnetJapon-$TAG.apk" --target "$GITHUB_SHA" \
              --title "Carnet Japon $TAG" --notes-file .github/release-notes.md
          fi
